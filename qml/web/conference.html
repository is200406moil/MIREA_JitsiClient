<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jitsi Meet</title>
  <style>
    html, body, #meeting { width: 100%; height: 100%; margin: 0; background: #040404; overflow: hidden; }
    iframe { display: block; border: 0; }
    #meeting.in-call:not(.whiteboard) iframe { height: calc(100% + 520px) !important; transform: translateY(-260px); }
    #meeting.whiteboard iframe { height: calc(100% + 80px) !important; transform: translateY(-80px); }
    #status { box-sizing: border-box; position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; padding: 32px; font: 16px/1.5 sans-serif; text-align: center; color: #a9b9ce; }
  </style>
</head>
<body>
<div id="status">Подготавливаем встречу…</div>
<div id="meeting"></div>
<script>
'use strict';
(function () {
    const config = __MEETING_CONFIG__;
    const preferences = config.preferences || {};
    const disabledSounds = [];
    const soundOptions = {
        soundReactions: 'REACTION_SOUND', soundMessage: 'INCOMING_MSG_SOUND',
        soundJoined: 'PARTICIPANT_JOINED_SOUND', soundLeft: 'PARTICIPANT_LEFT_SOUND',
        soundTalkMuted: 'TALK_WHILE_MUTED_SOUND', soundLobby: 'KNOCKING_PARTICIPANT_SOUND'
    };
    Object.keys(soundOptions).forEach(function (key) {
        if (preferences[key] === false) disabledSounds.push(soundOptions[key]);
    });
    let api = null;
    let localParticipantId = '';
    let participants = new Set();
    let participantsPaneVisible = false;
    let filmstripVisible = true;
    let filmstripHiddenForWhiteboard = false;
    const status = document.getElementById('status');

    function notify(name, data) {
        fetch('event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, data: data || {} }),
            credentials: 'omit'
        }).catch(function () {});
    }
    function countParticipants() {
        notify('participantCount', { count: participants.size });
    }
    function checkDevices() {
        if (!api || typeof api.getAvailableDevices !== 'function') return;
        api.getAvailableDevices().then(function (devices) {
            notify('deviceInventory', {
                audioInput: (devices.audioInput || []).length,
                videoInput: (devices.videoInput || []).length
            });
        }).catch(function () {});
    }
    function failed() {
        status.style.display = 'flex';
        status.textContent = 'Сервер встречи недоступен. Проверьте адрес сервера и подключение к интернету.';
        notify('scriptError');
    }
    window.auroraMeeting = {
        refreshParticipants: function () {
            if (!api || typeof api.getRoomsInfo !== 'function') return false;
            const meetingApi = api;
            meetingApi.getRoomsInfo().then(function (data) {
                if (api !== meetingApi) return;
                const room = (data.rooms || []).find(function (item) {
                    return (item.participants || []).some(function (person) { return person.id === localParticipantId; });
                });
                if (!room) return;
                notify('participantsSnapshot', {people: (room.participants || []).filter(function (person) {
                    return person.id !== localParticipantId && !person.isHidden;
                }).map(function (person) {
                    let avatar = person.avatarUrl || person.avatarURL || '';
                    if (!avatar && typeof api.getAvatarURL === 'function') avatar = api.getAvatarURL(person.id) || '';
                    return {id: person.id, name: person.displayName || person.id, avatarURL: avatar,
                        moderator: person.role === 'moderator', audioMuted: person.audioMuted, videoMuted: person.videoMuted};
                })});
            }).catch(function () {});
            return true;
        },
        command: function (name) {
            if (!api || !['toggleAudio', 'toggleVideo', 'toggleChat', 'hangup', 'toggleParticipantsPane', 'toggleTileView', 'toggleRaiseHand', 'toggleCamera', 'toggleShareScreen', 'setLowBandwidthMode'].includes(name)) return false;
            if (name === 'toggleParticipantsPane') {
                participantsPaneVisible = !participantsPaneVisible;
                api.executeCommand(name, participantsPaneVisible);
            } else if (name === 'setLowBandwidthMode') {
                api.executeCommand(name, true);
            } else api.executeCommand(name);
            return true;
        },
        openWhiteboard: function () {
            if (!api) return false;
            document.getElementById('meeting').classList.add('whiteboard');
            if (filmstripVisible) {
                api.executeCommand('toggleFilmStrip');
                filmstripVisible = false;
                filmstripHiddenForWhiteboard = true;
            }
            api.executeCommand('toggleWhiteboard', true);
            return true;
        },
        closeWhiteboard: function () {
            if (!api) return false;
            api.executeCommand('toggleWhiteboard', false);
            this.restoreFilmstrip();
            return true;
        },
        restoreFilmstrip: function () {
            if (!api) return false;
            document.getElementById('meeting').classList.remove('whiteboard');
            if (filmstripHiddenForWhiteboard) {
                api.executeCommand('toggleFilmStrip');
                filmstripVisible = true;
                filmstripHiddenForWhiteboard = false;
            }
            return true;
        },
        sendChatMessage: function (message) {
            if (!api || !message || !message.trim()) return false;
            api.executeCommand('sendChatMessage', message.trim());
            return true;
        },
        muteEveryone: function (mediaType) {
            if (!api) return false;
            api.executeCommand('muteEveryone', mediaType === 'video' ? 'video' : 'audio');
            return true;
        },
        setAudioOnly: function (enabled) {
            if (!api) return false;
            api.executeCommand('setAudioOnly', !!enabled);
            return true;
        },
        dispose: function () {
            if (api) { api.dispose(); api = null; }
        }
    };
    const script = document.createElement('script');
    script.src = config.server + '/external_api.js';
    script.onerror = failed;
    script.onload = function () {
        if (typeof JitsiMeetExternalAPI !== 'function') { failed(); return; }
        const server = new URL(config.server);
        const domain = server.host + server.pathname.replace(/\/$/, '');
        try {
            api = new JitsiMeetExternalAPI(domain, {
                roomName: config.room,
                parentNode: document.getElementById('meeting'),
                width: '100%',
                height: '100%',
                lang: preferences.language || 'ru',
                userInfo: { displayName: config.displayName, email: config.email, avatarURL: config.avatarURL },
                configOverwrite: {
                    disableDeepLinking: true,
                    prejoinConfig: { enabled: false },
                    startWithAudioMuted: config.audioMuted,
                    startWithVideoMuted: config.videoMuted,
                    disableSelfView: preferences.hideSelfView === true,
                    disabledSounds: disabledSounds,
                    disabledNotifications: preferences.chatNotifications === false ? ['notify.chatMessages'] : [],
                    // Preserve server policy unless the user explicitly disables P2P.
                    ...(preferences.disableP2p ? { p2p: { enabled: false } } : {}),
                    analytics: { disabled: true, rtcstatsEnabled: false, watchRTCEnabled: false },
                    toolbarButtons: [],
                    disableInviteFunctions: true,
                    hideConferenceSubject: true,
                    hideConferenceTimer: true,
                    doNotStoreRoom: true,
                    disableShortcuts: true
                },
                interfaceConfigOverwrite: {
                    MOBILE_APP_PROMO: false,
                    SHOW_JITSI_WATERMARK: false
                },
                onload: function () { status.style.display = 'none'; checkDevices(); }
            });
            notify('apiReady');
            ['audioMuteStatusChanged', 'videoMuteStatusChanged', 'passwordRequired',
             'readyToClose', 'cameraError', 'micError', 'errorOccurred', 'videoAvailabilityChanged', 'participantRoleChanged', 'avatarChanged', 'displayNameChange', 'participantMuted', 'whiteboardStatusChanged'].forEach(function (name) {
                api.addListener(name, function (data) { notify(name, data); });
            });
            api.addListener('filmstripDisplayChanged', function (data) {
                filmstripVisible = !!data.visible;
            });
            api.addListener('videoAvailabilityChanged', checkDevices);
            api.addListener('audioAvailabilityChanged', checkDevices);
            api.addListener('videoConferenceJoined', function (data) {
                localParticipantId = data.id;
                document.getElementById('meeting').classList.add('in-call');
                if (preferences.lowBandwidth === true) {
                    try { api.executeCommand('setLowBandwidthMode', true); }
                    catch (error) { notify('settingUnavailable', {setting:'lowBandwidth'}); }
                }
                status.style.display = 'none';
                participants.add(data.id);
                notify('videoConferenceJoined', { roomName: data.roomName, id: data.id });
                countParticipants();
            });
            api.addListener('participantJoined', function (data) { participants.add(data.id); countParticipants(); notify('participantJoined', data); });
            api.addListener('participantLeft', function (data) { participants.delete(data.id); countParticipants(); notify('participantLeft', data); });
            api.addListener('incomingMessage', function (data) { notify('incomingMessage', data); });
            api.addListener('outgoingMessage', function (data) { notify('outgoingMessage', data); });
            api.addListener('videoConferenceLeft', function () {
                document.getElementById('meeting').classList.remove('in-call');
                participants.clear();
                notify('videoConferenceLeft');
                countParticipants();
            });
        } catch (error) { failed(); }
    };
    document.head.appendChild(script);
    window.addEventListener('pagehide', function () { window.auroraMeeting.dispose(); });
}());
</script>
</body>
</html>
