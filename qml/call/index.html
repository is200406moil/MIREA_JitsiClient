<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jitsi Meet</title>
<link rel="stylesheet" href="call.css">
</head>
<body>
<div id="app">
    <div id="stage" class="stage"></div>
    <div id="tiles" class="tiles" hidden></div>

    <div id="titlebar" class="titlebar">
        <div class="room-wrap">
            <div id="room-name" class="room-name"></div>
            <div id="room-timer" class="label timer" hidden></div>
            <button id="insecure-label" class="label insecure" hidden><i class="icon" data-icon="exclamation-solid"></i></button>
        </div>
        <button id="tb-camera" class="tb-button"><i class="icon" data-icon="camera-refresh"></i></button>
        <button id="tb-participants" class="tb-button"><i class="icon" data-icon="users"></i><span id="participants-count" class="badge" hidden></span></button>
    </div>
    <div id="expanded-label" class="expanded-label" hidden></div>

    <div id="bottom" class="bottom">
        <div id="lonely" class="lonely" hidden>
            <div class="lonely-text" data-t="lonelyMeetingExperience.youAreAlone"></div>
            <button class="button primary" data-action="invite"><i class="icon" data-icon="add-user"></i><span data-t="lonelyMeetingExperience.button"></span></button>
        </div>
        <div id="notifications" class="notifications"></div>
        <div id="filmstrip" class="filmstrip"></div>
        <div id="toolbox" class="toolbox"></div>
    </div>

    <div id="reactions-layer" class="reactions-layer"></div>

    <div id="sheet-backdrop" class="backdrop" hidden></div>
    <div id="sheet" class="sheet" hidden></div>

    <section id="chat" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="chat.title"></h1>
        </header>
        <div id="chat-messages" class="chat-messages"></div>
        <div id="chat-recipient" class="chat-recipient" hidden>
            <span id="chat-recipient-text"></span>
            <button class="header-button" data-action="clear-recipient"><i class="icon" data-icon="close-large"></i></button>
        </div>
        <form id="chat-form" class="chat-input">
            <input id="chat-input" autocomplete="off" enterkeyhint="send">
            <button id="chat-send" class="send" type="submit" disabled><i class="icon" data-icon="send"></i></button>
        </form>
    </section>

    <section id="participants" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="participantsPane.title"></h1>
        </header>
        <div class="participants-body">
            <div id="lobby-list"></div>
            <button class="button primary wide" data-action="invite"><i class="icon" data-icon="add-user"></i><span data-t="participantsPane.actions.invite"></span></button>
            <div id="participants-heading" class="list-heading"></div>
            <div id="participants-list"></div>
        </div>
        <footer id="participants-footer" class="participants-footer" hidden>
            <button class="button secondary" data-action="mute-all" data-t="participantsPane.actions.muteAll"></button>
            <button class="button secondary icon-only" data-action="moderation-menu"><i class="icon" data-icon="dots-horizontal"></i></button>
        </footer>
    </section>

    <section id="waiting" class="screen waiting" hidden>
        <div id="waiting-room" class="waiting-room"></div>
        <div id="waiting-avatar" class="waiting-avatar"></div>
        <div class="waiting-panel">
            <div id="waiting-title" class="waiting-title"></div>
            <div class="spinner"></div>
            <div id="waiting-message" class="waiting-message"></div>
        </div>
    </section>

    <div id="connecting" class="connecting">
        <div class="spinner"></div>
        <div id="connecting-text" class="connecting-text"></div>
    </div>

    <div id="dialog-backdrop" class="backdrop dialog-backdrop" hidden></div>
    <div id="dialog" class="dialog" hidden></div>
</div>
<div id="audio-sink" hidden></div>
<script>window.CALL_CONFIG = __CALL_CONFIG__;</script>
<script src="call.js"></script>
</body>
</html>
