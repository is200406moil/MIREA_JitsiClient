<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jitsi Meet</title>
<link rel="stylesheet" href="call.css">
</head>
<body>
<div id="app">
    <div id="stage" class="stage"></div>
    <div id="shared-video" class="shared-video" hidden></div>
    <div id="tiles" class="tiles" hidden></div>

    <div id="titlebar" class="titlebar">
        <div class="room-wrap">
            <div id="room-name" class="room-name"></div>
            <div id="room-timer" class="label timer" hidden></div>
            <button id="insecure-label" class="label insecure" hidden><i class="icon medium" data-icon="warning"></i></button>
            <button id="audio-only-label" class="label audio-only" hidden data-t="videoStatus.lowBandwidthMode"></button>
            <button id="live-label" class="label live" hidden><i class="icon medium" data-icon="sites"></i></button>
            <button id="rec-label" class="label live" hidden><i class="icon medium" data-icon="record"></i></button>
            <button id="tr-label" class="label transcribing" hidden></button>
        </div>
        <button id="tb-camera" class="tb-button"><i class="icon" data-icon="camera-refresh"></i></button>
        <button id="tb-participants" class="tb-button"><i class="icon" data-icon="users"></i><span id="participants-count" class="badge" hidden></span></button>
    </div>
    <div id="visitors-label" class="visitors-label" hidden><i class="icon medium" data-icon="users"></i><span id="visitors-count"></span></div>
    <div id="expanded-label" class="expanded-label" hidden></div>

    <div id="bottom" class="bottom">
        <div id="lonely" class="lonely" hidden>
            <div class="lonely-text" data-t="lonelyMeetingExperience.youAreAlone"></div>
            <button class="button primary" data-action="invite"><i class="icon" data-icon="add-user"></i><span data-t="lonelyMeetingExperience.button"></span></button>
        </div>
        <div id="notifications" class="notifications"></div>
        <div id="filmstrip" class="filmstrip"></div>
        <div id="toolbox" class="toolbox"></div>
    </div>

    <div id="reactions-layer" class="reactions-layer"></div>

    <div id="sheet-backdrop" class="backdrop" hidden></div>
    <div id="sheet" class="sheet" hidden></div>

    <section id="chat" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="chat.title"></h1>
        </header>
        <nav id="chat-tabs" class="chat-tabs" hidden>
            <button data-tab="chat"></button>
            <button data-tab="polls"></button>
            <button data-tab="cc"></button>
        </nav>
        <div id="chat-pane" class="chat-pane">
        <div id="chat-messages" class="chat-messages"></div>
        <div id="chat-recipient" class="chat-recipient" hidden>
            <span id="chat-recipient-text"></span>
            <button class="header-button" data-action="clear-recipient"><i class="icon" data-icon="close-large"></i></button>
        </div>
        <div id="chat-disabled" class="chat-disabled" data-t="chat.disabled" hidden></div>
        <form id="chat-form" class="chat-input">
            <input id="chat-input" autocomplete="off" enterkeyhint="send">
            <button id="chat-send" class="send" type="submit" disabled><i class="icon" data-icon="send"></i></button>
        </form>
        </div>
        <div id="cc-pane" class="polls-pane" hidden>
            <div id="cc-list" class="polls-list"></div>
            <footer class="polls-footer"><button id="cc-toggle" class="button primary wide"></button></footer>
        </div>
        <div id="polls-pane" class="polls-pane" hidden>
            <div id="polls-list" class="polls-list"></div>
            <footer class="polls-footer"><button id="poll-create" class="button primary wide" data-t="polls.create.create"></button></footer>
        </div>
    </section>

    <section id="participants" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="participantsPane.title"></h1>
        </header>
        <div class="participants-body">
            <div id="lobby-list"></div>
            <button class="button primary wide" data-action="invite"><i class="icon" data-icon="add-user"></i><span data-t="participantsPane.actions.invite"></span></button>
            <input id="participants-search" class="field search" autocomplete="off">
            <div id="participants-heading" class="list-heading"></div>
            <div id="participants-list"></div>
        </div>
        <div class="participants-footer-wrap">
            <button id="breakout-button" class="button secondary breakout-button" data-action="breakout-rooms" hidden>
                <i class="icon" data-icon="breakout"></i><span data-t="breakoutRooms.buttonLabel"></span></button>
            <footer id="participants-footer" class="participants-footer" hidden>
                <button class="button secondary" data-action="mute-all" data-t="participantsPane.actions.muteAll"></button>
                <button class="button secondary icon-only" data-action="moderation-menu"><i class="icon" data-icon="dots-horizontal"></i></button>
            </footer>
        </div>
    </section>

    <section id="gifs" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <input id="gif-search" class="field search gif-search" autocomplete="off">
        </header>
        <div id="gif-grid" class="gif-grid"></div>
        <footer class="gif-footer"><span data-t="poweredby"></span><img src="icons/giphy-logo.png" alt="GIPHY"></footer>
    </section>

    <section id="livestream" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="dialog.liveStreaming"></h1>
            <button id="stream-start" class="header-action" data-t="dialog.start"></button>
        </header>
        <div class="stream-form">
            <input id="stream-key" class="field" autocomplete="off" autocapitalize="none" spellcheck="false">
            <div id="stream-key-error" class="field-error" hidden></div>
            <div id="stream-links" class="stream-links"></div>
        </div>
    </section>

    <section id="stats" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="speakerStats.speakerStats"></h1>
        </header>
        <div class="participants-body">
            <input id="stats-search" class="field search" autocomplete="off">
            <div id="stats-list"></div>
        </div>
    </section>

    <section id="breakout" class="screen" hidden>
        <header class="screen-header">
            <button class="header-button" data-action="close-screen"><i class="icon" data-icon="close-large"></i></button>
            <h1 data-t="breakoutRooms.title"></h1>
        </header>
        <div id="breakout-list" class="participants-body"></div>
        <footer id="breakout-footer" class="breakout-footer"></footer>
    </section>

    <section id="waiting" class="screen waiting" hidden>
        <div id="waiting-room" class="waiting-room"></div>
        <div id="waiting-avatar" class="waiting-avatar"></div>
        <div class="waiting-panel">
            <div id="waiting-title" class="waiting-title"></div>
            <div class="spinner"></div>
            <div id="waiting-message" class="waiting-message"></div>
        </div>
    </section>

    <div id="connecting" class="connecting">
        <div class="spinner"></div>
        <div id="connecting-text" class="connecting-text"></div>
    </div>

    <div id="dialog-backdrop" class="backdrop dialog-backdrop" hidden></div>
    <div id="dialog" class="dialog" hidden></div>
</div>
<div id="audio-sink" hidden></div>
<script>window.CALL_CONFIG = __CALL_CONFIG__;</script>
<script src="call.js"></script>
</body>
</html>
